# Despliegue del CRM al entorno dev.
#
# NO hay token ni access key: la autenticacion con AWS es por OIDC. GitHub emite un token
# firmado para este repo y esta rama, y AWS lo canjea por credenciales temporales de
# gpi-crm-dev-deployer, un rol que solo puede empujar a gpi-crm y refrescar gpi-dev-crm.
# La condicion de confianza esta clavada a refs/heads/dev: desde otra rama el canje falla.
name: Deploy CRM (dev)

on:
  push:
    branches: [dev]
    paths:
      - 'FrontendCRM/**'
      - '.github/workflows/deploy-crm-dev.yml'
  workflow_dispatch:

# Dos merges seguidos no pueden pisarse el deploy. cancel-in-progress queda en false a
# proposito: cortar un update-service a la mitad deja el servicio en un estado raro.
concurrency:
  group: deploy-crm-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # sin esto no se emite el token OIDC y el paso de credenciales falla

env:
  AWS_REGION: eu-west-1
  AWS_ROLE: arn:aws:iam::288078749170:role/gpi-crm-dev-deployer
  ECR_REPOSITORY: gpi-crm
  ECS_CLUSTER: gpi-cluster
  ECS_SERVICE: gpi-dev-crm
  ECS_TASK_FAMILY: gpi-dev-crm
  IMAGE_TAG: dev

jobs:
  deploy:
    name: Build, push y deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-crm-dev-${{ github.run_id }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"

          # Dos tags sobre la MISMA imagen: "dev" es el movil al que apunta la definicion
          # de task, y el sha queda como rastro de que commit esta corriendo. Para volver
          # atras basta reetiquetar un sha viejo como "dev" y relanzar el workflow.
          docker build \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            FrontendCRM

          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${GITHUB_SHA}"

          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Desplegar en ECS
        id: deploy
        run: |
          set -euo pipefail

          # Se reapunta el servicio a la FAMILIA, no a una revision fija: ECS resuelve la
          # ultima ACTIVE. Asi, si Terraform cambio env vars, secretos o cpu/memoria, ese
          # cambio entra en este deploy en vez de quedarse esperando para siempre (el
          # servicio tiene ignore_changes = [task_definition], es Terraform quien cede el
          # puntero al pipeline a proposito).
          #
          # --force-new-deployment obliga a levantar tasks nuevas aunque la revision no
          # haya cambiado, que es el caso normal: lo que cambio es el contenido del tag.
          REVISION=$(aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${ECS_TASK_FAMILY}" \
            --force-new-deployment \
            --query 'service.taskDefinition' \
            --output text)

          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "Servicio apuntando a ${REVISION}"

      - name: Esperar a que el servicio quede estable
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### CRM dev"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Imagen | \`${{ steps.build.outputs.image }}\` |"
            echo "| Task definition | \`${{ steps.deploy.outputs.revision }}\` |"
            echo "| URL | https://crm-dev.gopeakintelligence.com |"
          } >> "$GITHUB_STEP_SUMMARY"
