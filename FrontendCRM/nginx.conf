server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # OJO con add_header: nginx NO acumula por herencia. Si un `location` declara aunque
    # sea una cabecera propia, las del nivel de arriba dejan de aplicarse a ese bloque.
    # Por eso las de seguridad se repiten abajo en cada location que anade las suyas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El health check del target group pega aca cada 30s. Sin esta ruta serviria el
    # index.html entero, y ademas ensuciaria el access log.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Los assets de Vite llevan hash en el nombre, asi que su contenido nunca cambia:
    # se pueden cachear indefinidamente.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html NO se cachea: es el unico fichero que apunta a los assets nuevos, y si
    # el navegador lo guarda el deploy no se ve hasta que caduque.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # El router usa createWebHistory(), o sea rutas reales tipo /overview o /chats. Nginx
    # no las conoce: cualquier path que no sea un fichero en disco cae en index.html y lo
    # resuelve el router en el cliente. Sin esto, un F5 en /chats da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
